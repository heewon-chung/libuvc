[package]
name = "nova-bench"
version = "0.1.0"
edition = "2021"

[dependencies]
nova-snark = { version = "0.58", features = ["test-utils"] }
ff = "0.13"
csv = "1.3"
clap = { version = "4", features = ["derive"] }
bincode = "1.3"
serde = { version = "1", features = ["derive"] }
rayon = "1"

[profile.release]
opt-level = 3
lto = "thin"
